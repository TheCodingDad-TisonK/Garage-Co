<!-- App icon: a spanner over a tyre on a dark badge, drawn in code, rendered by node_modules/co-engine/tools/render-brand.js.
     ?size=256 sets the canvas; ?simple=1 drops the tyre and enlarges the spanner for 32px and below. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; }
  .badge { position: absolute; inset: 0; border-radius: 22.3%; background:
      radial-gradient(120% 110% at 28% 18%, #2d3139 0%, #1b1f26 42%, #0f1216 74%, #080a0d 100%); }
  .rim { position: absolute; inset: 0; border-radius: 22.3%; box-shadow: inset 0 0 0 var(--rim) rgba(245, 181, 61, .40); }
  .gloss { position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 22.3% 22.3% 50% 50% / 30% 30% 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,0)); }
  .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .mark svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="badge"></div>
  <div class="gloss"></div>
  <div class="mark" id="mark"></div>
  <div class="rim" id="rim"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var S = +q.get('size') || 256, simple = q.get('simple') === '1';
  var stage = document.getElementById('stage');
  stage.style.width = S + 'px'; stage.style.height = S + 'px';
  document.documentElement.style.setProperty('--rim', Math.max(1, Math.round(S * 0.012)) + 'px');
  var size = Math.round(S * (simple ? 0.80 : 0.74));
  var mark = document.getElementById('mark');
  mark.style.width = size + 'px'; mark.style.height = size + 'px';
  mark.style.filter = 'drop-shadow(0 ' + (S * 0.012) + 'px ' + (S * 0.02) + 'px rgba(0,0,0,.55))';
  // the tyre sits behind the spanner; the tiny sizes keep only the spanner
  var tyre = simple ? '' :
    '<circle cx="50" cy="50" r="36" fill="#1c2128" stroke="#3b434d" stroke-width="7"/>' +
    '<circle cx="50" cy="50" r="36" fill="none" stroke="#2a313a" stroke-width="3" stroke-dasharray="4 5"/>' +
    '<circle cx="50" cy="50" r="13" fill="#2b323b" stroke="#4a535e" stroke-width="2"/>' +
    '<circle cx="50" cy="50" r="4" fill="#6a7482"/>';
  var spanner =
    '<g transform="rotate(-45 50 50)">' +
    '<rect x="43" y="28" width="14" height="52" rx="7" fill="#f5b53d" stroke="#b07d1c" stroke-width="2"/>' +
    '<circle cx="50" cy="24" r="17" fill="#f5b53d" stroke="#b07d1c" stroke-width="2"/>' +
    '<rect x="43.5" y="6" width="13" height="16" fill="#14181d"/>' +
    '<circle cx="50" cy="84" r="13" fill="#f5b53d" stroke="#b07d1c" stroke-width="2"/>' +
    '<circle cx="50" cy="84" r="5.5" fill="#14181d"/>' +
    '<rect x="47" y="36" width="3" height="36" rx="1.5" fill="#ffd57a" opacity=".7"/>' +
    '</g>';
  mark.innerHTML = '<svg viewBox="0 0 100 100">' + tyre + spanner + '</svg>';
</script>
</body>
</html>
